name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README*.md'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Checkout wiki repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki

    - name: Sync files to wiki
      run: |
        # docs 配下の md ファイルをコピー
        # index.md, Home.md, _Sidebar.md は Wiki 側の管理とするため同期しない
        find docs -maxdepth 1 -name "*.md" ! -name "index*.md" ! -name "Home.md" ! -name "_Sidebar.md" -exec cp {} wiki/ \;
        
        # 不要なファイルを Wiki から削除（もし誤って存在していれば）
        rm -f wiki/index.md wiki/index.jp.md
        
        # 画像ディレクトリがあればコピー
        if [ -d "docs/images" ]; then
          mkdir -p wiki/images
          cp -r docs/images/* wiki/images/
        fi
        
        cd wiki
        # 変更がある場合のみコミット・プッシュ
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "docs: sync from main repository (automated)"
          git push
        else
          echo "No changes to sync."
        fi
