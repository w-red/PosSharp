name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README*.md'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Checkout wiki repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki

    - name: Sync files to wiki
      run: |
        # docs 配下の md ファイルを Wiki ルートにコピー
        cp docs/*.md wiki/
        
        # 画像ディレクトリがあればコピー
        if [ -d "docs/images" ]; then
          mkdir -p wiki/images
          cp -r docs/images/* wiki/images/
        fi
        
        # index.md を Home.md (Wikiのトップページ) として配置
        cp docs/index.md wiki/Home.md
        cp docs/index.jp.md wiki/Home.jp.md
        
        cd wiki
        # 変更がある場合のみコミット・プッシュ
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "docs: sync from main repository (automated)"
          git push
        else
          echo "No changes to sync."
        fi
