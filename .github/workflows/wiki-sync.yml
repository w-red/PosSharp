name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README*.md'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Checkout wiki repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools and dependencies
      run: |
        dotnet tool restore
        dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Generate API Documentation
      run: |
        # DefaultDocumentation を使用して temp_wiki にドキュメントを生成
        dotnet defaultdocumentation --output temp_wiki

    - name: Sync files to wiki
      run: |
        # 生成された Markdown を Wiki にコピー（管理用ファイルは除外）
        find temp_wiki -maxdepth 1 -name "*.md" ! -name "index*.md" ! -name "Home.md" ! -name "_Sidebar.md" -exec cp {} wiki/ \;
        
        # 手動管理ドキュメント（docs/）も同期（index.md 等は除外）
        find docs -maxdepth 1 -name "*.md" ! -name "index*.md" ! -name "Home.md" ! -name "_Sidebar.md" -exec cp {} wiki/ \;
        
        # 不要なファイルを Wiki から削除
        rm -f wiki/index.md wiki/index.jp.md
        
        # 画像ディレクトリがあればコピー
        if [ -d "docs/images" ]; then
          mkdir -p wiki/images
          cp -r docs/images/* wiki/images/
        fi
        
        cd wiki
        # 変更がある場合のみコミット・プッシュ
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "docs: sync from main repository (automated)"
          git push
        else
          echo "No changes to sync."
        fi
