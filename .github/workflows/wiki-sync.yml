name: Wiki Sync

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README*.md'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4

    - name: Checkout wiki repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools and dependencies
      run: |
        dotnet tool restore
        dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Generate API Documentation
      run: |
        # 各アセンブリに対してドキュメントを生成し temp_wiki に集約
        dotnet defaultdocumentation -a src/PosSharp.Abstractions/bin/Release/net10.0/PosSharp.Abstractions.dll --OutputDirectoryPath temp_wiki
        dotnet defaultdocumentation -a src/PosSharp.Core/bin/Release/net10.0/PosSharp.Core.dll --OutputDirectoryPath temp_wiki
        
        # Python を使用して BOM 除去とプレミアム・ヘッダーの挿入を確実に行う
        python3 -c '
        import os, glob
        header = """<p align="left"><a href="Home"><img src="images/mainlogo.png" width="40" vertical-align="middle"></a> <b>PosSharp v1.2.0 API Reference</b></p>\n\n---\n\n"""
        for fpath in glob.glob("temp_wiki/*.md"):
            with open(fpath, "rb") as f:
                content = f.read()
            # UTF-8 BOM (0xEF 0xBB 0xBF) を除去
            if content.startswith(b"\xef\xbb\xbf"):
                content = content[3:]
            # ヘッダーを結合して上書き保存
            with open(fpath, "w", encoding="utf-8") as f:
                f.write(header + content.decode("utf-8", errors="ignore"))
        '

    - name: Sync files to wiki
      run: |
        # 生成された Markdown を Wiki にコピー（管理用ファイルは除外）
        find temp_wiki -maxdepth 1 -name "*.md" ! -name "index*.md" ! -name "Home.md" ! -name "_Sidebar.md" -exec cp {} wiki/ \;
        
        # 画像ディレクトリがあればコピー
        if [ -d "docs/images" ]; then
          mkdir -p wiki/images
          cp -r docs/images/* wiki/images/
        fi
        
        cd wiki
        # 変更がある場合のみコミット・プッシュ
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "docs: sync from main repository (automated)"
          git push
        else
          echo "No changes to sync."
        fi
